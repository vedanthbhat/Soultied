# The native Soultied iPhone app (SwiftUI). GitHub's Macs turn this into an Xcode project with XcodeGen
# (see .github/workflows/native-ios.yml); nothing generated is kept in the repo.
name: Soultied
options:
  bundleIdPrefix: app.soultied
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    # (builds sent to TestFlight are numbered 1000 + the run's number instead; see .github/workflows/native-ios.yml)
    CURRENT_PROJECT_VERSION: "1"
    # the app's bundle id; its home-screen widgets are this + .widget, and the keychain group they share is this + .shared
    APP_BUNDLE_ID: app.soultied
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SoultiedCore:
    path: SoultiedCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"

targets:
  Soultied:
    type: application
    platform: iOS
    sources:
      - path: Soultied
      # what the app and its widgets both use (WidgetShare, and the widgets' faces for the screenshots)
      - path: Shared
      # the pixel font, Firebase's settings and the icon live elsewhere in the repo; the app uses them as they are
      # (the icon's picture is drawn by scripts/ios-assets.mjs before a build)
      - path: ../public/fonts/PixelifySans-Variable.ttf
        buildPhase: resources
      # the record's Night in Venice, for the first tour (so it plays straight away, even offline)
      - path: ../public/audio/night-in-venice.mp3
        buildPhase: resources
      - path: ../ios/App/App/GoogleService-Info.plist
        buildPhase: resources
      - path: ../ios/App/App/Assets.xcassets
        buildPhase: resources
      # the Netflix / Prime Video browser's scripts: the extension's player, made by scripts/native-stream.mjs
      - path: Stream
        buildPhase: resources
        optional: true
    entitlements:
      path: Soultied/Soultied.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # its own group first (so where Firebase and Google keep things doesn't move), then the one it shares
        # with its widgets (WidgetShare.swift)
        keychain-access-groups:
          - $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID)
          - $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).shared
    info:
      path: Soultied/Info.plist
      properties:
        CFBundleDisplayName: Soultied
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [PixelifySans-Variable.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # sideways, the home screen is the whole living room
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CFBundleURLTypes:
          # Google sign-in hands back to the app through this address (REVERSED_CLIENT_ID in GoogleService-Info.plist)
          - CFBundleURLSchemes: [com.googleusercontent.apps.244397778893-sej2cpv7mis4279vdoh7eh8u2g510bj3]
          # a tap on a home-screen widget: soultied://doodle, soultied://photos
          - CFBundleURLSchemes: [soultied]
        SoultiedKeychainGroup: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).shared
        NSCameraUsageDescription: So you can take a photo for your wall, and so your person can see you on a call.
        NSMicrophoneUsageDescription: So your person can hear you on a call, at karaoke night, and in the voice notes you leave them.
        NSLocationWhenInUseUsageDescription: So the two of you can see how far apart you are. Soultied only keeps the town, never the street.
        NSPhotoLibraryUsageDescription: So you can put your photos on your shared wall.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Soultied
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SoultiedCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      # the home-screen widgets, inside the app
      - target: SoultiedWidget

  # The home-screen widgets: their doodle in a frame, and your photos as Polaroids on a cork board
  SoultiedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SoultiedWidget
      - path: Shared
      - path: ../public/fonts/PixelifySans-Variable.ttf
        buildPhase: resources
    entitlements:
      path: SoultiedWidget/SoultiedWidget.entitlements
      properties:
        keychain-access-groups:
          - $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).shared
    info:
      path: SoultiedWidget/Info.plist
      properties:
        CFBundleDisplayName: Soultied
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [PixelifySans-Variable.ttf]
        SoultiedKeychainGroup: $(DEVELOPMENT_TEAM).$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: SoultiedWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    dependencies:
      - package: SoultiedCore

schemes:
  Soultied:
    build:
      targets:
        Soultied: all
    run:
      config: Debug
    archive:
      config: Release
