# Builds the Soultied iPhone app on one of GitHub's Macs and sends it to TestFlight.
# Runs when the iPhone app's files change, or by hand (Actions > Soultied for iPhone > Run workflow).
#
# The app itself is a thin shell around soultied.app (Capacitor), so most changes to Soultied reach the
# app without a new build. A new build is only needed when the files in ios/ change.
#
# To send builds to TestFlight it needs, under Settings > Secrets and variables > Actions:
#   secrets  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8  an App Store Connect API key (Admin), and its .p8 file's text
#   variable APPLE_TEAM_ID                          the Apple developer Team ID
# Until those are there, it still checks that the app builds (for the iPhone simulator, unsigned).
name: Soultied for iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'ios-web/**'
      - 'capacitor.config.json'
      - 'scripts/ios-assets.mjs'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Is the App Store Connect key set up?
        id: key
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::notice::Not sending to TestFlight yet: missing in Settings > Secrets and variables > Actions:$missing. Checking that the app builds instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # AI Studio doesn't keep a package-lock.json, so install from package.json
      - run: npm install --no-audit --no-fund

      - name: Draw the icon and opening screen
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.35.5
          npm run ios:assets

      - name: Copy the app's settings and plugins into the Xcode project
        run: npx cap sync ios

      - name: Which Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check it builds (iPhone simulator, unsigned)
        if: steps.key.outputs.ready != 'true'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          echo "The iPhone app builds. Add the App Store Connect key to send builds to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Write the App Store Connect key
        if: steps.key.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Build and sign
        if: steps.key.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Soultied.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Send to TestFlight
        if: steps.key.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Soultied.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build ${{ github.run_number }} is on its way to TestFlight. App Store Connect takes a few minutes to process it, then it shows up in the TestFlight app on your iPhone." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
