# Builds the native Soultied iPhone app (native/, SwiftUI) on one of GitHub's Macs and checks it:
#   1. the shared code's tests (SoultiedCore), including that its letters engine picks exactly the cards the website does
#   2. the app builds for the iPhone simulator
#   3. screenshots of the app in the demo room
#   4. when asked, sends the build to TestFlight for the "Friends and family" testers (see below)
# Anyone can read what happened without signing in: build errors are annotations on the run, and the screenshots
# (with the build's errors and warnings) are kept on the native-shots branch, replaced every run.
# Runs when the native app (or the questions it shares with the website) change, or by hand.
#
# A build goes to TestFlight when it's asked for: Actions > Soultied for iPhone (native) > Run workflow with
# "Send it to TestFlight" ticked, or a push whose commit message has [testflight] in it. Its build number is 1000
# plus the run's number (above the web-shell app's builds). It uses the App Store Connect key and the secrets
# described in ios.yml and testflight.yml, and the same steps as testflight.yml (.github/testflight.py) to put the
# build in front of testers.
name: Soultied for iPhone (native)

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Send it to TestFlight
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/native-*'
      - '.github/native-shots.py'
      - 'scripts/ios-assets.mjs'
      - 'src/letters/**'
      # (the app's Netflix / Prime Video browser runs the extension's player)
      - 'extension/src/**'
      - 'src/stream/**'
      - '.github/workflows/native-ios.yml'

# (a newer push stops a run that's only checking; a run sending a build to TestFlight always finishes)
concurrency:
  group: ${{ (inputs.testflight || contains(github.event.head_commit.message, '[testflight]')) && format('native-testflight-{0}', github.run_id) || 'native-ios' }}
  cancel-in-progress: true

permissions:
  # (to keep the screenshots on the native-shots branch)
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      # the build number sent to TestFlight, if one was
      sent: ${{ steps.upload.outputs.number }}
    env:
      SEND: ${{ inputs.testflight || contains(github.event.head_commit.message, '[testflight]') }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # AI Studio doesn't keep a package-lock.json, so install from package.json
      - run: npm install --no-audit --no-fund

      - name: Write the questions and the escape rooms for the app, and what the website's engines say
        run: |
          node --experimental-strip-types scripts/native-decks.mjs
          npx esbuild scripts/native-escape.ts --bundle --platform=node --log-level=warning --outfile="$RUNNER_TEMP/escape.cjs"
          node "$RUNNER_TEMP/escape.cjs"
          npx esbuild scripts/native-fixtures.ts --bundle --platform=node --log-level=warning --outfile="$RUNNER_TEMP/fx.cjs"
          node "$RUNNER_TEMP/fx.cjs" "$RUNNER_TEMP/fixtures.json"
          # the extension's player, for the app's own Netflix / Prime Video browser
          node scripts/native-stream.mjs

      - name: Draw the icon
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.35.5
          npm run ios:assets

      - name: Which Xcode
        run: |
          xcodebuild -version
          swift --version

      # (on failure the app still builds, so one run says everything that's wrong)
      - name: Test the shared code
        id: core
        continue-on-error: true
        run: |
          set -o pipefail
          cd native/SoultiedCore
          SOULTIED_FIXTURES="$RUNNER_TEMP/fixtures.json" swift test 2>&1 | tee "$RUNNER_TEMP/core.log"

      - name: Make the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd native && xcodegen generate

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('native/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project native/Soultied.xcodeproj \
            -scheme Soultied \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*(deprecated|never|unused)|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/build.log"

      # The full log needs a GitHub sign-in to read, so put the errors where anyone can see them
      - name: Show what went wrong
        if: failure() || steps.core.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, re
          logs = [os.path.join(os.environ['RUNNER_TEMP'], f) for f in ('core.log', 'build.log')]
          seen, errs = set(), []
          for p in logs:
              if not os.path.exists(p):
                  continue
              for line in open(p, errors='replace'):
                  m = re.match(r'^(/\S+?):(\d+):(\d+): error: (.*)$', line.strip())
                  if m and line not in seen:
                      seen.add(line)
                      f = m.group(1).split('/native/', 1)[-1]
                      errs.append((('native/' + f) if '/native/' in m.group(1) else m.group(1), m.group(2), m.group(3), m.group(4)))
                  elif ('error:' in line or 'failed' in line.lower()) and line not in seen and len(errs) < 200:
                      seen.add(line)
                      errs.append(('', '', '', line.strip()[:400]))
          for f, l, c, msg in errs[:9]:
              print(f'::error file={f},line={l},col={c}::{msg}' if f else f'::error::{msg}')
          rest = ' || '.join((f'{f}:{l}:{c}: {msg}' if f else msg) for f, l, c, msg in errs[9:])
          if rest:
              print('::error title=more errors::' + rest[:60000])
          PY

      - name: Take screenshots in the demo room
        id: shots
        run: |
          set -x
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Soultied.app"
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ds=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']] or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(ds[-1]['udid'])")
          xcrun simctl boot "$dev"
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl status_bar "$dev" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$dev" "$app"
          mkdir -p "$RUNNER_TEMP/shots"
          shot() {
            name=$1; shift
            xcrun simctl terminate "$dev" app.soultied 2>/dev/null || true
            xcrun simctl launch "$dev" app.soultied "$@"
            sleep 9
            xcrun simctl io "$dev" screenshot "$RUNNER_TEMP/shots/$name.png"
          }
          shot welcome
          shot intro -introHold
          shot home -demo -tab home
          shot letters -demo -tab letters
          shot wall -demo -open wall
          shot watch -demo -tab watch
          shot watch-on -demo -tab watch -watch dQw4w9WgXcQ
          shot watch-netflix -demo -tab watch -service netflix -partnerWatching
          shot stream-netflix -demo -tab watch -service netflix -stream netflix
          shot stream-prime -demo -tab watch -service prime -stream prime
          shot play -demo -tab play
          shot us -demo -tab us
          shot mood -demo -open me
          shot decor -demo -open decor
          shot fireflies -demo -game fireflies
          shot boats -demo -game boats
          shot tug -demo -game tug -invite
          shot rps -demo -game rps -invite
          shot quickdraw -demo -game quickdraw -invite
          shot doodle -demo -game doodle -invite
          shot coasters -demo -game coasters -invite
          shot kitchen -demo -game kitchen -invite
          shot escape -demo -escape
          shot escape-attic -demo -escape attic -escapeStep 1 -escapeOpen trunk
          shot escape-music -demo -escape attic -escapeStep 3 -escapeOpen musicbox
          shot escape-tiles -demo -escape library -escapeStep 3 -escapeOpen tiles
          shot escape-ghost -demo -escape cellar -escapeStep 4 -escapeOpen ghostA
          shot escape-map -demo -escape office -escapeStep 4 -escapeOpen map
          shot record -demo -record
          shot record-sheet -demo -record -open music
          shot tour-you -demo -tour 0
          shot tour-wall -demo -tour 2
          shot tour-pet -demo -tour 3
          shot tour-music -demo -tour 5
          shot tour-watch -demo -tour 6
          shot pet -demo -open pet
          # turned sideways as a show starts: Netflix stays up (it used to close for the room)
          shot stream-sideways -demo -tab watch -service netflix -stream netflix -sideways
          # the Starlight look
          shot star-welcome -theme starlight
          shot star-home -demo -tab home -theme starlight
          shot star-letters -demo -tab letters -theme starlight
          shot star-watch -demo -tab watch -theme starlight
          shot star-play -demo -tab play -theme starlight
          shot star-us -demo -tab us -theme starlight
          shot star-looks -demo -tab us -theme starlight -looks
          shot looks -demo -tab us -looks
          # Soultied Plus: the sheet that sells it
          shot plus -demo -plus
          # the doodle pad (finer now), and the home-screen widgets as the app draws them
          shot wall-doodle -demo -open doodle
          shot widgets -widgets doodle
          shot widgets-board -widgets board
          shot widgets-empty -widgets empty
          ls -la "$RUNNER_TEMP/shots"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"

      # (not when a newer push stopped this run: its empty page would replace the last good one)
      - name: Keep the screenshots and the build's messages (on the native-shots branch)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/native-shots.py

      - name: Did the app crash?
        if: always() && steps.shots.outcome != 'skipped'
        run: |
          d="$HOME/Library/Logs/DiagnosticReports"
          ls "$d" 2>/dev/null | grep -i soultied | head -3 | while read -r f; do
            echo "::error title=crash::$(head -c 6000 "$d/$f" | tr '\n' ' ' | sed 's/  */ /g')"
          done || true

      - name: The shared code's tests
        if: steps.core.outcome == 'failure'
        run: |
          grep -E "error:|failed" "$RUNNER_TEMP/core.log" | head -20 | while IFS= read -r line; do echo "::error title=core test::${line:0:600}"; done
          exit 1

      # ---------- to TestFlight, when asked (only after everything above passed) ----------

      - name: Is everything there to send it?
        id: send
        if: env.SEND == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Can't send to TestFlight: missing in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
          echo "number=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      # Built the way ios.yml does it: signed only "to run locally" here (which keeps the app's entitlements, like
      # Sign in with Apple), and given its App Store signature when it's sent below
      - name: Build for the App Store
        if: steps.send.outputs.number
        run: |
          set -o pipefail
          xcodebuild archive \
            -project native/Soultied.xcodeproj \
            -scheme Soultied \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Soultied.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ steps.send.outputs.number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/archive.log"
          {
            echo "### What the app is allowed to do (entitlements)"
            echo '```'
            codesign -d --entitlements - "$RUNNER_TEMP/Soultied.xcarchive/Products/Applications/Soultied.app" 2>&1 | grep -v "^Executable=" | head -30 || true
            echo "and its home-screen widgets:"
            codesign -d --entitlements - "$RUNNER_TEMP/Soultied.xcarchive/Products/Applications/Soultied.app/PlugIns/SoultiedWidget.appex" 2>&1 | grep -v "^Executable=" | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the App Store Connect key
        if: steps.send.outputs.number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Signs it for the App Store with a certificate Apple keeps for the team (cloud signing), makes the App Store
      # profile if there isn't one, and uploads it
      - name: Sign and send to TestFlight
        id: upload
        if: steps.send.outputs.number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Soultied.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          echo "number=${{ steps.send.outputs.number }}" >> "$GITHUB_OUTPUT"
          echo "Build ${{ steps.send.outputs.number }} of the native app is on its way to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      # The full log needs a GitHub sign-in to read, so put the lines that matter where anyone can see them
      - name: Why it didn't reach TestFlight
        if: failure() && steps.send.outputs.number
        run: |
          logs=$(ls "$RUNNER_TEMP"/archive.log "$RUNNER_TEMP"/upload.log 2>/dev/null || true)
          [ -n "$logs" ] || exit 0
          {
            echo "### What went wrong"
            echo '```'
            cat $logs | grep -E "error:|error :|warning: .*(sign|profile|entitlement)|\*\* (ARCHIVE|EXPORT) FAILED|[Pp]rovisioning|[Ss]igning|certificate|Error Domain|IDEDistribution|NSLocalized" | sort -u | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat $logs | grep -E "error:|Error Domain" | sort -u | head -8 | while IFS= read -r line; do echo "::error title=TestFlight::${line:0:500}"; done || true
          dist=$(grep -ho "/[^']*\.xcdistributionlogs" "$RUNNER_TEMP"/upload.log 2>/dev/null | head -1 || true)
          if [ -n "$dist" ] && [ -d "$dist" ]; then
            {
              echo "### What Xcode noted while sending"
              echo '```'
              cat "$dist"/IDEDistribution*.log 2>/dev/null | grep -iE "error|fail|denied|not (found|permitted|allowed)|certificate|profile" | grep -viE "authorization|bearer|token" | sort -u | tail -40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # Once Apple has the build: the testers' notes, the "Friends and family" group, and Apple's beta review
  testers:
    needs: build
    if: needs.build.outputs.sent
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      TESTER_EMAIL: ${{ secrets.TESTER_EMAIL }}
      BUILD_NUMBER: ${{ needs.build.outputs.sent }}
      APP_KIND: native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Get the build to testers
        run: |
          pip install --quiet --disable-pip-version-check "pyjwt[crypto]==2.10.1"
          python .github/testflight.py
