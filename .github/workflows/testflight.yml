# Gets Soultied's iPhone builds to testers outside the Apple team (friends and family) through TestFlight.
# Runs after every web-shell iPhone build ("Soultied for iPhone"), when this file changes, or by hand (Actions > Run
# workflow). The native app's builds do the same from native-ios.yml. What it does is in .github/testflight.py.
#
# Uses the same App Store Connect key as ios.yml, plus two secrets under Settings > Secrets and variables > Actions:
#   REVIEW_PHONE  a phone number Apple's beta reviewer can call, like +919812345678
#   TESTER_EMAIL  the email TestFlight sends the invite to (also shown to testers for feedback)
# They're secrets so they stay out of this public repo.
name: TestFlight for friends and family

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight.yml'
      - '.github/testflight.py'
  workflow_run:
    workflows: ['Soultied for iPhone']
    types: [completed]

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      TESTER_EMAIL: ${{ secrets.TESTER_EMAIL }}
      # the build that just finished, when an iPhone build started this (its number is that run's number)
      BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Is the App Store Connect key set up?
        id: key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No App Store Connect key yet (see ios.yml), so nothing to do."
          fi

      - uses: actions/setup-python@v6
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - uses: actions/checkout@v5
        if: steps.key.outputs.ready == 'true'

      - name: Get the build to testers
        if: steps.key.outputs.ready == 'true'
        run: |
          pip install --quiet --disable-pip-version-check "pyjwt[crypto]==2.10.1"
          python .github/testflight.py
