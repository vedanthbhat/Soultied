# Publishes the Soultied website to GitHub Pages (soultied.app) on every push to main.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # AI Studio doesn't keep a package-lock.json, so install from package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          # Optional: a relay for video calls on networks that block direct ones (see src/watch/ice.ts).
          # Set it under Settings > Secrets and variables > Actions > Variables. Empty means no relay.
          VITE_TURN_CREDENTIALS_URL: ${{ vars.TURN_CREDENTIALS_URL }}
      # any unknown address still opens the app (it reads ?join=... itself)
      - run: cp dist/index.html dist/404.html
      # the browser extension, for people who open a watch-party link without it (until it's on the Chrome Web Store)
      - run: npm run build:extension:store && cp extension/soultied-extension-*.zip dist/soultied-extension.zip
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
