# Deploys Soultied's server side to Firebase whenever it changes: the Soultied Plus checkout
# (functions/) and the Firestore security rules (firestore.rules).
#
# Needs, under Settings > Secrets and variables > Actions (see functions/README.md):
#   secrets   FIREBASE_SERVICE_ACCOUNT  a Google Cloud service account key (JSON) that's allowed to deploy
#             RAZORPAY_KEY_ID           Razorpay > Account & Settings > API Keys (paying in India)
#             RAZORPAY_KEY_SECRET       the same place
#             DODO_API_KEY              Dodo Payments > Developer > API Keys (paying from anywhere else)
#   variables PLUS_MONTH_PAISE, PLUS_YEAR_PAISE   (optional) the rupee prices in paise; 14900 = ₹149
#             DODO_MODE                 test or live (the key and products must be from that mode)
#             DODO_PRODUCT_MONTH, DODO_PRODUCT_YEAR   Dodo's product ids (pdt_…) for a month and a year
# Until the deploy key is there, this does nothing (and says so). With only one of Razorpay or Dodo,
# the other way to pay stays closed on the Plus page.
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', '.github/workflows/firebase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      PROJECT: soultied-c1543
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_RAZORPAY: ${{ secrets.RAZORPAY_KEY_ID != '' && secrets.RAZORPAY_KEY_SECRET != '' }}
      HAS_DODO: ${{ secrets.DODO_API_KEY != '' }}
    steps:
      - name: Waiting for the deploy key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret (see functions/README.md) to deploy Soultied's functions and rules."

      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the functions' packages
        if: env.HAS_KEY == 'true'
        run: npm install --prefix functions --no-audit --no-fund

      - name: Sign in to Google Cloud
        if: env.HAS_KEY == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/deploy-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/deploy-key.json" >> "$GITHUB_ENV"

      - name: Payment keys into Secret Manager
        if: env.HAS_KEY == 'true' && (env.HAS_RAZORPAY == 'true' || env.HAS_DODO == 'true')
        env:
          KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          DODO_KEY: ${{ secrets.DODO_API_KEY }}
        run: |
          # "unset" for a way to pay that isn't set up yet (the functions treat it as closed)
          printf '%s' "${KEY_ID:-unset}" | npx -y firebase-tools@15 functions:secrets:set RAZORPAY_KEY_ID --data-file=- --project "$PROJECT" --non-interactive
          printf '%s' "${KEY_SECRET:-unset}" | npx -y firebase-tools@15 functions:secrets:set RAZORPAY_KEY_SECRET --data-file=- --project "$PROJECT" --non-interactive
          printf '%s' "${DODO_KEY:-unset}" | npx -y firebase-tools@15 functions:secrets:set DODO_API_KEY --data-file=- --project "$PROJECT" --non-interactive

      - name: Prices
        if: env.HAS_KEY == 'true'
        run: |
          {
            printf 'PLUS_MONTH_PAISE=%s\nPLUS_YEAR_PAISE=%s\n' "${{ vars.PLUS_MONTH_PAISE || '14900' }}" "${{ vars.PLUS_YEAR_PAISE || '119900' }}"
            printf 'DODO_MODE=%s\nDODO_PRODUCT_MONTH=%s\nDODO_PRODUCT_YEAR=%s\n' "${{ vars.DODO_MODE || 'test' }}" "${{ vars.DODO_PRODUCT_MONTH || 'unset' }}" "${{ vars.DODO_PRODUCT_YEAR || 'unset' }}"
          } > "functions/.env.$PROJECT"

      - name: Deploy
        if: env.HAS_KEY == 'true'
        run: |
          # without any payment keys yet, only the rules go out (the checkout needs them)
          ONLY=firestore:rules
          if [ "$HAS_RAZORPAY" = "true" ] || [ "$HAS_DODO" = "true" ]; then ONLY=functions,firestore:rules; fi
          npx -y firebase-tools@15 deploy --only "$ONLY" --project "$PROJECT" --non-interactive --force

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key.json"
