<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soultied</title>
    <style>
      /* shown by the iPhone app when soultied.app can't be reached */
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('fonts/PixelifySans-Variable.ttf') format('truetype');
        font-weight: 400 700;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1d1512;
        color: #3a2a26;
        font-family: 'Pixelify Sans', ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .card {
        background: #f4e8d0;
        box-shadow: 0 0 0 3px #3a2a26, 6px 6px 0 3px rgba(0, 0, 0, 0.35);
        padding: 24px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        line-height: 1.35;
        color: #6b5850;
      }
      button {
        font: inherit;
        font-size: 18px;
        font-weight: 600;
        color: #fff8ec;
        background: #b8674d;
        border: 0;
        box-shadow: 0 0 0 3px #3a2a26, inset 0 -4px 0 rgba(0, 0, 0, 0.18);
        padding: 10px 16px;
        cursor: pointer;
        align-self: flex-start;
      }
      svg {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="card" role="alert">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M3 1h3v1H3zM9 1h3v1H9zM2 2h1v1H2zM6 2h1v1H6zM8 2h1v1H8zM12 2h1v1h-1zM1 3h1v4H1zM7 3h1v1H7zM13 3h1v1h-1zM0 4h1v3H0zM14 4h1v3h-1zM2 7h1v1H2zM13 7h1v1h-1zM2 8h1v1H2zM12 8h1v1h-1zM3 9h1v1H3zM11 9h1v1h-1zM4 10h1v1H4zM10 10h1v1h-1zM5 11h1v1H5zM9 11h1v1H9zM6 12h1v1H6zM8 12h1v1H8zM7 13h1v1H7z" fill="#3a2a26" />
        <path d="M3 2h3v1H3zM9 2h3v1H9zM2 3h5v1H2zM8 3h5v1H8zM1 4h13v3H1zM2 7h11v1H2zM3 8h9v1H3zM4 9h7v1H4zM5 10h5v1H5zM6 11h3v1H6zM7 12h1v1H7z" fill="#d9534f" />
      </svg>
      <h1>Your place is just out of reach</h1>
      <p>Soultied needs the internet to bring you and your person together. Check your connection, then try again.</p>
      <button type="button" onclick="location.href = 'https://soultied.app/'">Try again</button>
    </div>
  </body>
</html>
